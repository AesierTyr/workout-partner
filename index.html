<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fbf8f5">
<title>המאמנת שלי</title>
<style>
  :root{
    --bg:#fbf8f5;
    --surface:#ffffff;
    --border:#e7e0d8;
    --text:#201d1a;
    --muted:#6b6259;
    --accent:#d9542f;
    --accent-ink:#ffffff;
    --danger:#b3392a;
    --ok-bg:#eef3ea;
    --radius:16px;
    --tap:56px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:18px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
  }
  h1{font-size:26px;margin:6px 0 18px;font-weight:800;}
  h2{font-size:21px;margin:0 0 10px;font-weight:700;}
  p{color:var(--muted);margin:0 0 14px;}
  .step-label{color:var(--muted);font-size:14px;margin-bottom:4px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:var(--tap);
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:18px;
    font-weight:600;
    padding:12px 16px;
    margin-bottom:10px;
    cursor:pointer;
    text-align:center;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-size:20px;
    font-weight:800;
    min-height:64px;
  }
  .btn-primary:disabled{opacity:.4;}
  .btn-secondary{
    background:transparent;
    border:none;
    color:var(--accent);
    font-weight:700;
    min-height:auto;
    padding:10px;
  }
  .btn-danger{color:var(--danger);border-color:var(--danger);}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:none;
    text-decoration:underline;
    min-height:auto;
    font-weight:500;
    font-size:16px;
  }
  .option-btn{
    width:100%;
    text-align:right;
    min-height:var(--tap);
    border-radius:14px;
    border:2px solid var(--border);
    background:var(--surface);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .option-btn .opt-title{font-size:19px;font-weight:700;}
  .option-btn .opt-desc{font-size:14px;color:var(--muted);}
  .option-btn.selected{border-color:var(--accent);background:#fdf1ec;}
  input[type=text],textarea{
    width:100%;
    font-size:19px;
    padding:14px;
    border-radius:14px;
    border:2px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    margin-bottom:14px;
  }
  textarea{min-height:80px;resize:vertical;}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .spacer{flex:1;}
  .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:32px;}
  .progress-dots{display:flex;gap:6px;margin-bottom:18px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .dot.active{background:var(--accent);}
  .equip-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    border:2px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .equip-item.checked{border-color:var(--accent);background:#fdf1ec;}
  .equip-icon{
    flex:0 0 56px;width:56px;height:56px;
    border-radius:50%;
    background:#fbe4da;
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .equip-icon svg{width:34px;height:34px;}
  .equip-item.checked .equip-icon{background:var(--accent);color:#fff;}
  .equip-body{flex:1;min-width:0;}
  .equip-he{font-size:18px;font-weight:700;}
  .equip-en{font-size:13px;color:var(--muted);}
  .equip-desc{font-size:14px;color:var(--muted);margin-top:4px;}
  .equip-check{
    flex:0 0 26px;width:26px;height:26px;border-radius:8px;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .equip-item.checked .equip-check{background:var(--accent);border-color:var(--accent);color:#fff;}
  .disclaimer-box{
    background:#fff7ec;
    border:1px solid #ecd9b8;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    font-size:15px;
    color:#4d3c22;
  }
  .disclaimer-box b{display:block;margin-bottom:6px;font-size:16px;}
  .greet{font-size:28px;font-weight:800;margin-bottom:4px;}
  .subgreet{font-size:17px;color:var(--muted);margin-bottom:22px;}
  .home-cta{
    width:100%;
    min-height:120px;
    border-radius:20px;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:26px;
    font-weight:800;
    margin:14px 0 20px;
    cursor:pointer;
  }
  .streak-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ok-bg);
    color:#3c5a30;
    border-radius:999px;
    padding:8px 14px;
    font-size:14px;
    font-weight:600;
    margin-bottom:16px;
  }
  .link-row{display:flex;gap:18px;justify-content:center;margin-top:auto;padding-top:20px;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#201d1a;color:#fff;padding:12px 20px;border-radius:12px;
    font-size:15px;z-index:50;max-width:90%;text-align:center;
  }
  .day-card{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface);}
  .day-card h3{margin:0 0 8px;font-size:17px;}
  .ex-row{display:flex;justify-content:space-between;font-size:15px;padding:6px 0;border-top:1px dashed var(--border);}
  .ex-row:first-of-type{border-top:none;}
  .plan-ex-row{
    display:flex;justify-content:space-between;align-items:center;width:100%;
    font-size:15px;padding:10px 2px;border-top:1px dashed var(--border);
    background:none;border-left:none;border-right:none;border-bottom:none;
    text-align:right;cursor:pointer;min-height:44px;color:var(--text);font-family:inherit;
  }
  .plan-ex-row:first-of-type{border-top:none;}
  .plan-ex-row-static{cursor:default;color:var(--muted);}
  .plan-ex-name{font-weight:600;}
  .plan-ex-meta{color:var(--muted);display:flex;align-items:center;gap:8px;font-size:13px;}
  .plan-ex-swap{color:var(--accent);font-weight:700;white-space:nowrap;}

  .chart-wrap{margin-top:10px;}
  .progress-chart{width:100%;height:70px;display:block;}
  .progress-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
  .progress-dot{fill:var(--accent);}
  .muted{color:var(--muted);}
  bdi{unicode-bidi:isolate;}
  .checkbox-note{font-size:13px;color:var(--muted);margin:-4px 0 16px;}

  /* Session runner */
  .ex-name{font-size:34px;font-weight:800;margin:4px 0 2px;line-height:1.2;}
  .ex-en{font-size:15px;color:var(--muted);margin-bottom:14px;}
  .ex-svg{width:100%;max-width:280px;margin:0 auto 16px;color:var(--accent);}
  .ex-svg svg{width:100%;height:auto;display:block;}
  .ex-target{font-size:19px;font-weight:700;margin-bottom:4px;}
  .ex-set-label{font-size:15px;color:var(--muted);margin-bottom:10px;}
  .ex-weight-hint{font-size:15px;color:var(--text);background:#fdf1ec;border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .ex-cues{margin:0 0 16px;padding-inline-start:20px;font-size:16px;line-height:1.6;}
  .ex-cues li{margin-bottom:6px;}
  .session-btn-row{display:flex;gap:10px;}
  .session-btn-row .btn{flex:1;}

  .stepper-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .stepper-label{font-size:17px;font-weight:600;}
  .stepper-controls{display:flex;align-items:center;gap:14px;}
  .stepper-btn{
    width:48px;height:48px;border-radius:50%;
    border:2px solid var(--border);background:var(--surface);
    font-size:24px;font-weight:700;color:var(--accent);cursor:pointer;
  }
  .stepper-value{min-width:56px;text-align:center;font-size:22px;font-weight:800;}

  .feel-row{display:flex;gap:10px;margin-bottom:16px;}
  .feel-btn{flex:1;}

  .rest-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px 0;}
  .rest-ring-wrap{position:relative;width:240px;height:240px;margin-bottom:20px;}
  .rest-ring-svg{width:100%;height:100%;transform:rotate(-90deg);}
  .rest-ring-bg{fill:none;stroke:var(--border);stroke-width:14;}
  .rest-ring-fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .rest-seconds{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;}
  .rest-next{font-size:17px;color:var(--muted);text-align:center;}

  .headphone-hint{
    background:#fdf1ec;border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;font-size:14px;color:var(--text);margin-bottom:12px;text-align:center;
  }
  .toggle-row{display:flex;justify-content:space-between;align-items:center;text-align:right;}
  .toggle-row.toggle-on{border-color:var(--accent);}
  .toggle-state{font-weight:700;color:var(--muted);}
  .toggle-row.toggle-on .toggle-state{color:var(--accent);}
  .rate-row{display:flex;gap:10px;margin-bottom:10px;}
  .rate-row .option-btn{margin-bottom:0;text-align:center;}

  .always-sub-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:15px;color:var(--muted);}

  .pr-box{background:var(--ok-bg);border:1px solid #cfe0c4;border-radius:14px;padding:16px;margin-bottom:16px;color:#3c5a30;}
  .pr-box b{display:block;margin-bottom:6px;font-size:16px;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ---------------------------------------------------------------------
   STORAGE
--------------------------------------------------------------------- */
var STORAGE_KEY = 'coach_v1';

function defaultState(){
  return {
    profile:{
      name:'',
      daysPerWeek:3,
      sessionMinutes:45,
      goal:'general',
      focusAreas:[],
      voiceEnabled:true,
      voiceRate:1,
      repCounting:false,
      voiceUnavailableWarned:false,
      localLangNames:false
    },
    equipment:{},
    equipmentNote:'',
    plan:null,
    log:[],
    disabledExercises:[],
    streak:{current:0,lastSessionDate:null},
    localNames:{},
    setupDone:false,
    activeSession:null,
    ui:{screen:'setup_name'}
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    parsed.profile = Object.assign(d.profile, parsed.profile||{});
    parsed.equipment = parsed.equipment || {};
    parsed.equipmentNote = parsed.equipmentNote || '';
    parsed.plan = parsed.plan || null;
    parsed.log = parsed.log || [];
    parsed.disabledExercises = parsed.disabledExercises || [];
    parsed.streak = parsed.streak || d.streak;
    parsed.localNames = parsed.localNames || {};
    parsed.setupDone = !!parsed.setupDone;
    parsed.activeSession = parsed.activeSession || null;
    parsed.ui = parsed.ui || {screen: parsed.setupDone ? 'home' : 'setup_name'};
    return parsed;
  }catch(e){
    return defaultState();
  }
}

var state = loadState();

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    /* storage full or unavailable - nothing we can do offline; fail silently */
  }
}

--------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
   BASIC PLAN GENERATOR (phase 1 - simplified; full §8 algorithm in phase 2)
--------------------------------------------------------------------- */
var SLOT_ORDER = ['squat_lunge','hinge','horizontal_push','horizontal_pull','vertical','core','accessory'];

function hasEquipmentFor(ex){
  // Bodyweight and mat exercises must always be available, even with a
  // completely empty equipment checklist, so a valid plan can always be built.
  return ex.equipment.every(function(id){ return id === 'mat' || !!state.equipment[id]; });
}

function availableExercises(){
  return EXERCISES.filter(function(ex){
    if(ex.pattern === 'mobility') return false;
    if(ex.level > 1) return false;
    if(state.disabledExercises.indexOf(ex.id) !== -1) return false;
    return hasEquipmentFor(ex);
  });
}

// Slots whose exercise choice is meant to stay stable week over week, so the
// number on the bar/machine for the day's main lifts is actually comparable
// from one session to the next. Everything else (core work, bonus accessory
// slots added when the time budget allows it) rotates to keep things fresh.
var ANCHOR_SLOTS = ['squat_lunge','hinge','horizontal_push','horizontal_pull','vertical'];

var WARMUP_SEC = 5*60;
var COOLDOWN_SEC = 5*60;
var SECONDS_PER_REP_SET = 40; // rough time-under-tension per set, per spec §8.4
// Exercise COUNT is fit to the time budget using a fixed reference set count,
// not the current week's actual set count. Otherwise a session would balloon
// from ~7 exercises to ~10 during the 2-sets calibration weeks just because
// each one is quicker - the same session should stay roughly the same length
// and shape every week; only the sets-per-exercise (2 -> 3) and which specific
// exercise fills a rotating slot should change week to week.
var REFERENCE_SETS = 3;
var MIN_EXERCISES_PER_DAY = 5; // guarantees the 5 primary movement-pattern slots always fit
var MAX_EXERCISES_PER_DAY = 9;
var MAX_EXTRA_ROUNDS = 3;

function pickForSlot(slot, pool, used, rotation){
  var candidates;
  if(slot === 'squat_lunge') candidates = pool.filter(function(e){ return e.pattern==='squat' || e.pattern==='lunge'; });
  else if(slot === 'vertical') candidates = pool.filter(function(e){ return e.pattern==='vertical_push' || e.pattern==='vertical_pull'; });
  else if(slot === 'accessory') candidates = pool.filter(function(e){ return ['squat','hinge','vertical_push','vertical_pull'].indexOf(e.pattern)!==-1; });
  else candidates = pool.filter(function(e){ return e.pattern===slot; });
  candidates = candidates.filter(function(e){ return used.indexOf(e.id)===-1; });
  if(!candidates.length) return null;
  // Rotate which candidate leads so different days of the same week, and the
  // same day in later weeks, don't always land on the identical exercise.
  return candidates[rotation % candidates.length];
}

function mobilityPick(idsPreferred){
  for(var i=0;i<idsPreferred.length;i++){
    var ex = EXERCISE_BY_ID[idsPreferred[i]];
    if(ex && hasEquipmentFor(ex)) return ex;
  }
  return null;
}

// Training week number since her first logged session (week 1 = brand new).
// Drives both the 2-vs-3 sets rule and how far the week-to-week rotation has
// advanced. Purely a function of calendar time, so re-generating the plan
// twice in the same week yields the identical plan (§8: deterministic, no
// randomness beyond variety selection).
function getCurrentWeekNumber(){
  if(!state.log.length) return 1;
  var earliest = state.log.reduce(function(min, entry){
    var t = new Date(entry.date).getTime();
    return isNaN(t) ? min : Math.min(min, t);
  }, Infinity);
  if(!isFinite(earliest)) return 1;
  var weeksElapsed = Math.floor((Date.now() - earliest) / (7*24*3600*1000));
  return Math.max(1, weeksElapsed + 1);
}

function setsForWeek(week){
  return week <= 2 ? 2 : 3;
}

function buildDay(nameHe, pool, dayIndex, weekNumber){
  var sets = setsForWeek(weekNumber);
  var budgetSec = Math.max(0, state.profile.sessionMinutes*60 - WARMUP_SEC - COOLDOWN_SEC);
  var used = [];
  var blocks = [];
  var usedSec = 0;
  var i = 0;
  var round = 0;

  while(round <= MAX_EXTRA_ROUNDS && blocks.length < MAX_EXERCISES_PER_DAY){
    if(i >= SLOT_ORDER.length){
      i = 0;
      round++;
      continue;
    }
    var slot = SLOT_ORDER[i];
    var isAnchor = round === 0 && ANCHOR_SLOTS.indexOf(slot) !== -1;
    var rotation = isAnchor ? dayIndex : (dayIndex + weekNumber + round);
    var ex = pickForSlot(slot, pool, used, rotation);
    i++;
    if(!ex) continue;
    var refSec = REFERENCE_SETS * (SECONDS_PER_REP_SET + ex.restSec);
    if(blocks.length >= MIN_EXERCISES_PER_DAY && usedSec + refSec > budgetSec) break;
    used.push(ex.id);
    blocks.push({exerciseId:ex.id, sets:sets, repRange:ex.repRange.slice(), restSec:ex.restSec});
    usedSec += refSec;
  }

  var warm = mobilityPick(rotate(['cat_cow','hip_circles','shoulder_rolls','treadmill_walk','bike_easy'], dayIndex));
  var cool = mobilityPick(rotate(['child_pose','cat_cow'], dayIndex));
  var warmupBlocks = warm ? [{exerciseId:warm.id, sets:1, repRange:warm.repRange.slice(), restSec:0}] : [];
  var cooldownBlocks = cool ? [{exerciseId:cool.id, sets:1, repRange:cool.repRange.slice(), restSec:0}] : [];
  return {id:nameHe.replace(/\s/g,'_'), nameHe:nameHe, warmup:warmupBlocks, blocks:blocks, cooldown:cooldownBlocks};
}

function rotate(arr, n){
  var i = n % arr.length;
  return arr.slice(i).concat(arr.slice(0, i));
}

var DAY_LETTERS = ['א׳','ב׳','ג׳','ד׳'];

function generatePlan(){
  var pool = availableExercises();
  var weekNumber = getCurrentWeekNumber();
  var days = [];
  for(var d=0; d<state.profile.daysPerWeek; d++){
    days.push(buildDay('גוף מלא ' + DAY_LETTERS[d % DAY_LETTERS.length], pool, d, weekNumber));
  }
  return {generatedAt:new Date().toISOString(), split:'fullbody', weekNumber:weekNumber, days:days};
}

/* ---------------------------------------------------------------------
   HISTORY (§5.6) - per-exercise weight progression, total sessions, PB.
   Plain inline-SVG line chart, no library: she wants to see the line go
   up, not analyze it.
--------------------------------------------------------------------- */
function buildProgressSVG(weights){
  var w = 300, h = 70, pad = 12;
  var minW = Math.min.apply(null, weights);
  var maxW = Math.max.apply(null, weights);
  var range = Math.max(1, maxW - minW);
  var xFor = function(i){ return weights.length>1 ? pad + (i/(weights.length-1)) * (w-2*pad) : w/2; };
  var yFor = function(v){ return h - pad - ((v-minW)/range) * (h-2*pad); };
  var points = weights.map(function(v,i){ return xFor(i)+','+yFor(v); }).join(' ');
  var dots = weights.map(function(v,i){
    return '<circle class="progress-dot" cx="'+xFor(i)+'" cy="'+yFor(v)+'" r="3.5"/>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="progress-chart" preserveAspectRatio="none">' +
    '<polyline class="progress-line" points="'+points+'"/>' + dots + '</svg>';
}

function renderHistory(){
  var h = document.createElement('h1');
  h.textContent = 'היסטוריה';
  app.appendChild(h);

  var sessionDates = {};
  state.log.forEach(function(e){ if(e.sets && e.sets.length) sessionDates[e.date] = true; });
  var totalSessions = Object.keys(sessionDates).length;

  var summary = document.createElement('div');
  summary.className = 'streak-pill';
  summary.textContent = 'סה"כ ' + totalSessions + ' אימונים נרשמו';
  app.appendChild(summary);

  var byExercise = {};
  state.log.forEach(function(e){
    if(!e.sets || !e.sets.length) return;
    if(!byExercise[e.exerciseId]) byExercise[e.exerciseId] = [];
    byExercise[e.exerciseId].push({date:e.date, weight:sessionMaxWeight(e)});
  });

  var exerciseIds = Object.keys(byExercise).sort(function(a,b){
    var pointsA = byExercise[a], pointsB = byExercise[b];
    var lastA = pointsA[pointsA.length-1].date, lastB = pointsB[pointsB.length-1].date;
    return new Date(lastB) - new Date(lastA);
  });

  if(!exerciseIds.length){
    var p = document.createElement('p');
    p.textContent = 'עוד אין נתונים - אחרי כמה אימונים תראי כאן את ההתקדמות שלך.';
    app.appendChild(p);
  }

  exerciseIds.forEach(function(exId){
    var ex = EXERCISE_BY_ID[exId];
    if(!ex) return;
    var points = byExercise[exId].slice().sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    var weights = points.map(function(pt){ return pt.weight; });
    var best = Math.max.apply(null, weights);

    var card = document.createElement('div');
    card.className = 'day-card';
    var h3 = document.createElement('h3');
    h3.textContent = ex.he;
    card.appendChild(h3);

    var bestRow = document.createElement('div');
    bestRow.className = 'ex-row';
    bestRow.innerHTML = '<span>שיא אישי</span><span class="muted"><bdi>'+best+' ק"ג</bdi></span>';
    card.appendChild(bestRow);

    var countRow = document.createElement('div');
    countRow.className = 'ex-row';
    countRow.innerHTML = '<span>מספר פעמים</span><span class="muted">'+weights.length+'</span>';
    card.appendChild(countRow);

    if(weights.length >= 2){
      var chartWrap = document.createElement('div');
      chartWrap.className = 'chart-wrap';
      chartWrap.innerHTML = buildProgressSVG(weights);
      card.appendChild(chartWrap);
    }

/* ---------------------------------------------------------------------
   WAKE LOCK - keep the screen on during a session (§5.4, §11)
--------------------------------------------------------------------- */
var wakeLockSentinel = null;
var silentAudioEl = null;
var wakeLockWarned = false;

function createSilentAudioURL(durationSec){
  var sampleRate = 8000;
  var numSamples = sampleRate * durationSec;
  var buffer = new ArrayBuffer(44 + numSamples*2);
  var view = new DataView(buffer);
  function writeString(offset, str){
    for(var i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
  }
  writeString(0,'RIFF'); view.setUint32(4, 36+numSamples*2, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,numSamples*2,true);
  var blob = new Blob([buffer], {type:'audio/wav'});
  return URL.createObjectURL(blob);
}

function startSilentAudioFallback(){
  if(silentAudioEl) return;
  try{
    silentAudioEl = document.createElement('audio');
    silentAudioEl.src = createSilentAudioURL(2);
    silentAudioEl.loop = true;
    silentAudioEl.setAttribute('playsinline', '');
    silentAudioEl.style.display = 'none';
    document.body.appendChild(silentAudioEl);
    silentAudioEl.play().catch(function(){});
  }catch(e){}
  if(!wakeLockWarned){
    wakeLockWarned = true;
    toast('כדאי להגדיל את זמן נעילת המסך האוטומטית בהגדרות הטלפון לזמן האימון');
  }
}

function stopSilentAudioFallback(){
  if(silentAudioEl){
    silentAudioEl.pause();
    silentAudioEl.remove();
    silentAudioEl = null;
  }
}

function requestWakeLock(){
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(sentinel){
      wakeLockSentinel = sentinel;
    }).catch(function(){
      startSilentAudioFallback();
    });
  }else{
    startSilentAudioFallback();
  }
}

function releaseWakeLock(){
  if(wakeLockSentinel){
    wakeLockSentinel.release().catch(function(){});
    wakeLockSentinel = null;
  }
  stopSilentAudioFallback();
}

document.addEventListener('visibilitychange', function(){
  if(state.activeSession && document.visibilityState === 'visible'){
    requestWakeLock();
    if('speechSynthesis' in window && window.speechSynthesis.paused){
      window.speechSynthesis.resume();
    }
  }
});

/* ---------------------------------------------------------------------
   VOICE COACH (§6) - Chrome/Android Google TTS is the target. Never fall
   back to an English voice mangling Hebrew text, and never trust a
   network-only voice since it would go silent in airplane mode.
--------------------------------------------------------------------- */
var VOICE_STATE = {voice:null, available:false, checked:false};

function pickHebrewVoice(){
  if(!('speechSynthesis' in window)) return null;
  var voices = window.speechSynthesis.getVoices();
  var heLocal = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().indexOf('he') === 0 && v.localService === true;
  });
  return heLocal[0] || null;
}

function finalizeVoiceDetection(){
  if(VOICE_STATE.checked) return;
  VOICE_STATE.checked = true;
  VOICE_STATE.voice = pickHebrewVoice();
  VOICE_STATE.available = !!VOICE_STATE.voice;
}

function initVoice(){
  if(!('speechSynthesis' in window)){
    VOICE_STATE.checked = true;
    return;
  }
  var voices = window.speechSynthesis.getVoices();
  if(voices.length){
    finalizeVoiceDetection();
  }else{
    window.speechSynthesis.addEventListener('voiceschanged', function onChange(){
      window.speechSynthesis.removeEventListener('voiceschanged', onChange);
      finalizeVoiceDetection();
    });
    // Some browsers cache voices without ever firing voiceschanged.
    setTimeout(finalizeVoiceDetection, 1500);
  }
}

var repCountTimeouts = [];
function clearRepCounting(){
  repCountTimeouts.forEach(function(id){ clearTimeout(id); });
  repCountTimeouts = [];
}

function speak(text){
  clearRepCounting();
  if(!state.profile.voiceEnabled || !VOICE_STATE.available || !VOICE_STATE.voice) return;
  try{
    window.speechSynthesis.cancel(); // never let cues stack
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'he-IL';
    utter.voice = VOICE_STATE.voice;
    utter.rate = state.profile.voiceRate || 1;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

var HEBREW_COUNT_WORDS = ['אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר','אחת עשרה','שתים עשרה','שלוש עשרה','ארבע עשרה','חמש עשרה','שש עשרה','שבע עשרה','שמונה עשרה','תשע עשרה','עשרים'];
function startRepCounting(targetReps){
  if(!state.profile.repCounting || !state.profile.voiceEnabled || !VOICE_STATE.available) return;
  clearRepCounting();
  for(var i=0; i<targetReps && i<HEBREW_COUNT_WORDS.length; i++){
    (function(word, delay){
      var id = setTimeout(function(){
        if(!state.profile.voiceEnabled || !VOICE_STATE.available) return;
        try{
          window.speechSynthesis.cancel();
          var utter = new SpeechSynthesisUtterance(word);
          utter.lang = 'he-IL';
          utter.voice = VOICE_STATE.voice;
          utter.rate = state.profile.voiceRate || 1;
          window.speechSynthesis.speak(utter);
        }catch(e){}
      }, delay);
      repCountTimeouts.push(id);
    })(HEBREW_COUNT_WORDS[i], (i+1)*1500);
  }
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  return audioCtx;
}

function beep(freq, durMs){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.frequency.value = freq || 880;
    gain.gain.value = 0.15;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + (durMs||150)/1000);
  }catch(e){}
}

   SESSION RUNNER - data helpers
--------------------------------------------------------------------- */
function flattenDayExercises(day){
  var list = [];
  (day.warmup||[]).forEach(function(b,i){
    list.push({exerciseId:b.exerciseId, sets:b.sets, repRange:b.repRange.slice(), restSec:b.restSec, kind:'warmup', srcArray:'warmup', srcIndex:i});
  });
  (day.blocks||[]).forEach(function(b,i){
    list.push({exerciseId:b.exerciseId, sets:b.sets, repRange:b.repRange.slice(), restSec:b.restSec, kind:'main', srcArray:'blocks', srcIndex:i});
  });
  (day.cooldown||[]).forEach(function(b,i){
    list.push({exerciseId:b.exerciseId, sets:b.sets, repRange:b.repRange.slice(), restSec:b.restSec, kind:'cooldown', srcArray:'cooldown', srcIndex:i});
  });
  return list;
}

function weightIncrement(ex){
  return ex.equipment.indexOf('dumbbells') !== -1 ? 1 : 2.5;
}

function lastWeightFor(exerciseId){
  for(var i=state.log.length-1; i>=0; i--){
    var entry = state.log[i];
    if(entry.exerciseId === exerciseId && entry.sets && entry.sets.length){
      return entry.sets.reduce(function(m,s){ return Math.max(m, s.weight||0); }, 0);
    }
  }
  return null;
}

function personalBestFor(exerciseId){
  var best = null;
  state.log.forEach(function(entry){
    if(entry.exerciseId !== exerciseId || !entry.sets) return;
    entry.sets.forEach(function(s){
      if(s.weight!=null && (best===null || s.weight>best)) best = s.weight;
    });
  });
  return best;
}

function logEntriesFor(exerciseId){
  return state.log
    .filter(function(e){ return e.exerciseId === exerciseId && e.sets && e.sets.length; })
    .sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
}

function sessionMaxWeight(entry){
  return entry.sets.reduce(function(m,s){ return Math.max(m, s.weight||0); }, 0);
}

// Progression logic per spec §8: proposes next session's weight from how the
// last logged session actually went, not just "whatever she did last time".
// Rounds a ~10% cut down to the nearest valid increment, and guarantees an
// actual decrease (rounding a small weight/increment pair up to the same
// number would silently undo the whole point of the cut).
function reduceWeight(weight, inc){
  var reduced = Math.floor((weight * 0.9) / inc) * inc;
  if(reduced >= weight) reduced = weight - inc;
  return Math.max(0, reduced);
}

function suggestedWeightFor(exerciseId){
  var ex = EXERCISE_BY_ID[exerciseId];
  var entries = logEntriesFor(exerciseId);
  if(!entries.length) return null;

  var last = entries[entries.length-1];
  var lastWeight = sessionMaxWeight(last);
  var inc = weightIncrement(ex);

  var allTopRange = last.sets.every(function(s){ return s.reps >= ex.repRange[1]; });
  var allEasy = last.sets.every(function(s){ return s.feel === 'קל'; });
  var missedOrHeavy = last.sets.some(function(s){ return s.feel === 'מדי כבד' || s.reps < ex.repRange[0]; });

  var suggestion = lastWeight;
  var note = null;

  if(allTopRange && allEasy){
    suggestion = lastWeight + inc;
    note = 'עלית בכל הסטים בקלות - קדימה, מעלים משקל';
  }else if(missedOrHeavy){
    var prev = entries[entries.length-2];
    var prevMissedOrHeavy = prev && prev.sets.some(function(s){ return s.feel === 'מדי כבד' || s.reps < ex.repRange[0]; });
    if(prevMissedOrHeavy){
      suggestion = reduceWeight(lastWeight, inc);
      note = 'הרגיש כבד פעמיים ברצף - יורדים קצת במשקל';
    }else{
      suggestion = lastWeight;
      note = 'אותו משקל כמו פעם שעברה - ננסה שוב';
    }
  }

  var daysSinceLast = (Date.now() - new Date(last.date).getTime()) / 86400000;
  if(daysSinceLast > 10){
    suggestion = reduceWeight(suggestion, inc);
    note = 'עבר קצת זמן מהאימון האחרון, אז ירדנו קלות במשקל כדי לחזור בבטחה';
  }

  return {lastWeight:lastWeight, suggestion:suggestion, note:note};
}

function formatMMSS(totalSeconds){
  var s = Math.max(0, Math.round(totalSeconds));
  var m = Math.floor(s/60);
  var r = s%60;
  return m + ':' + (r<10?'0':'') + r;
}

/* ---------------------------------------------------------------------
   SESSION RUNNER - lifecycle
--------------------------------------------------------------------- */
function startSession(){
  var day = dayNameForToday();
  if(!day) return;
  var flattened = flattenDayExercises(day);
  if(!flattened.length){
    toast('אין כרגע תרגילים זמינים - בדקי את הציוד בהגדרות');
    return;
  }
  var needsVoiceNotice = state.profile.voiceEnabled && VOICE_STATE.checked &&
    !VOICE_STATE.available && !state.profile.voiceUnavailableWarned;
  state.activeSession = {
    dayId: day.id,
    startedAt: new Date().toISOString(),
    exercises: flattened,
    currentIndex: 0,
    setLogs: {},
    phase: needsVoiceNotice ? 'voice_notice' : 'exercise',
    pendingReps: 0,
    pendingWeight: 0,
    restEndAt: null,
    restDurationSec: 0,
    lastAnnouncedSecond: null,
    finalized: false,
    summary: null
  };
  saveState();
  requestWakeLock();
  go('session');
  if(!needsVoiceNotice){
    var first = state.activeSession.exercises[0];
    speak(buildSessionStartText(day) + ' ' + buildNewExerciseText(first, EXERCISE_BY_ID[first.exerciseId], true));
    if(first.kind === 'main') startRepCounting(first.repRange[1]);
  }
}

function dismissVoiceNotice(){
  state.profile.voiceUnavailableWarned = true;
  state.activeSession.phase = 'exercise';
  saveState();
  render();
}

function currentSessionItem(){
  return state.activeSession.exercises[state.activeSession.currentIndex];
}

function advanceExercise(){
  var s = state.activeSession;
  s.currentIndex++;
  if(s.currentIndex >= s.exercises.length){
    finalizeSessionData();
    s.phase = 'summary';
    saveState();
    render();
    speak(buildSessionEndText(s.summary));
  }else{
    s.phase = 'exercise';
    saveState();
    render();
    var item = s.exercises[s.currentIndex];
    speak(buildNewExerciseText(item, EXERCISE_BY_ID[item.exerciseId], false));
    if(item.kind === 'main') startRepCounting(item.repRange[1]);
  }
}

function enterLogging(){
  var s = state.activeSession;
  var item = currentSessionItem();
  var suggestion = suggestedWeightFor(item.exerciseId);
  s.pendingReps = item.repRange[1];
  s.pendingWeight = suggestion ? suggestion.suggestion : 0;
  s.phase = 'logging';
  saveState();
  render();
}

function submitSet(feel){
  var s = state.activeSession;
  var idx = s.currentIndex;
  var item = currentSessionItem();
  var prevBest = personalBestFor(item.exerciseId);
  var isPR = prevBest !== null && s.pendingWeight > prevBest;
  if(!s.setLogs[idx]) s.setLogs[idx] = [];
  s.setLogs[idx].push({weight:s.pendingWeight, reps:s.pendingReps, feel:feel});
  startRest(item.restSec, isPR);
}

function startRest(sec, isPR){
  var s = state.activeSession;
  s.phase = 'resting';
  s.restDurationSec = sec;
  s.restEndAt = new Date(Date.now() + sec*1000).toISOString();
  s.lastAnnouncedSecond = null;
  saveState();
  render();
  var lines = [];
  if(isPR) lines.push('שיא אישי! זה משקל שיא שברת בתרגיל הזה.');
  lines.push('יפה. ' + sec + ' שניות מנוחה.');
  speak(lines.join(' '));
}

function finishRest(){
  var s = state.activeSession;
  var item = currentSessionItem();
  var logsForCur = s.setLogs[s.currentIndex] || [];
  if(item.kind === 'main' && logsForCur.length < item.sets){
    s.phase = 'exercise';
    saveState();
    render();
    speak('סט הבא. קדימה.');
    startRepCounting(item.repRange[1]);
  }else{
    advanceExercise();
  }
}

function skipExercise(){
  advanceExercise();
}

function substituteCandidatesForExercise(exerciseId){
  var ex = EXERCISE_BY_ID[exerciseId];
  var subs = (ex && ex.substitutes) || [];
  var out = [];
  subs.forEach(function(id){
    var cand = EXERCISE_BY_ID[id];
    if(!cand) return;
    if(state.disabledExercises.indexOf(id) !== -1) return;
    if(!hasEquipmentFor(cand)) return;
    out.push(cand);
  });
  return out.slice(0,3);
}

function substituteCandidates(item){
  return substituteCandidatesForExercise(item.exerciseId);
}

function chooseSubstitute(cand, always){
  var s = state.activeSession;
  var item = currentSessionItem();
  item.exerciseId = cand.id;
  item.repRange = cand.repRange.slice();
  item.restSec = cand.restSec;
  if(always && state.plan){
    var day = state.plan.days.filter(function(d){ return d.id === s.dayId; })[0];
    if(day && day[item.srcArray] && day[item.srcArray][item.srcIndex]){
      day[item.srcArray][item.srcIndex].exerciseId = cand.id;
      day[item.srcArray][item.srcIndex].repRange = cand.repRange.slice();
      day[item.srcArray][item.srcIndex].restSec = cand.restSec;
    }
  }
  s.phase = 'exercise';
  saveState();
  render();
  speak(buildNewExerciseText(item, cand, false));
  if(item.kind === 'main') startRepCounting(item.repRange[1]);
}

function confirmPain(){
  var s = state.activeSession;
  var idx = s.currentIndex;
  var item = currentSessionItem();
  var setsLogged = s.setLogs[idx] || [];
  state.log.push({date:s.startedAt, dayId:s.dayId, exerciseId:item.exerciseId, sets:setsLogged, painFlag:true});
  if(state.disabledExercises.indexOf(item.exerciseId) === -1){
    state.disabledExercises.push(item.exerciseId);
  }
  item.painReported = true;
  state.plan = generatePlan();
  saveState();
  toast('התרגיל הוסר מהתוכניות הבאות - אפשר להפעיל אותו מחדש בהגדרות');
  advanceExercise();
}

function finalizeSessionData(){
  var s = state.activeSession;
  if(s.finalized) return;
  var newEntries = [];
  var prNames = [];
  s.exercises.forEach(function(item, idx){
    if(item.kind !== 'main' || item.painReported) return;
    var setsLogged = s.setLogs[idx];
    if(!setsLogged || !setsLogged.length) return;
    var prevBest = personalBestFor(item.exerciseId);
    var maxThisSession = setsLogged.reduce(function(m,x){ return Math.max(m, x.weight||0); }, 0);
    if(prevBest === null || maxThisSession > prevBest){
      prNames.push(EXERCISE_BY_ID[item.exerciseId].he);
    }
    newEntries.push({date:s.startedAt, dayId:s.dayId, exerciseId:item.exerciseId, sets:setsLogged, painFlag:false});
  });
  newEntries.forEach(function(e){ state.log.push(e); });
  state.streak.current = (state.streak.current||0) + 1;
  state.streak.lastSessionDate = s.startedAt;
  var totalMinutes = Math.max(1, Math.round((Date.now() - new Date(s.startedAt).getTime())/60000));
  var totalVolume = newEntries.reduce(function(sum,e){
    return sum + e.sets.reduce(function(s2,st){ return s2 + (st.weight||0)*(st.reps||0); }, 0);
  }, 0);
  s.summary = {totalMinutes:totalMinutes, totalVolume:Math.round(totalVolume), prNames:prNames};
  s.finalized = true;
  saveState();
}

function endSession(){
  releaseWakeLock();
  state.activeSession = null;
  go('home');
}

/* ---------------------------------------------------------------------
   SESSION RUNNER - rendering
--------------------------------------------------------------------- */
var restIntervalHandle = null;
function clearRestTicker(){
  if(restIntervalHandle){
    clearInterval(restIntervalHandle);
    restIntervalHandle = null;
  }
}

function renderSession(){
  var s = state.activeSession;
  if(!s){ go('home'); return; }
  switch(s.phase){
    case 'voice_notice': renderSessionVoiceNotice(); break;
    case 'exercise': renderSessionExercise(); break;
    case 'logging': renderSessionLogging(); break;
    case 'resting': renderSessionResting(); break;
    case 'substitute': renderSessionSubstitute(); break;
    case 'pain_confirm': renderSessionPainConfirm(); break;
    case 'summary': renderSessionSummary(); break;
    default: renderSessionExercise();
  }
}

function renderSessionResting(){
  var s = state.activeSession;

  var wrap = document.createElement('div');
  wrap.className = 'rest-wrap';

  var ringWrap = document.createElement('div');
  ringWrap.className = 'rest-ring-wrap';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 200 200');
  svg.setAttribute('class','rest-ring-svg');
  var r = 88;
  var circumference = 2*Math.PI*r;
  var bg = document.createElementNS(svgNS,'circle');
  bg.setAttribute('cx',100); bg.setAttribute('cy',100); bg.setAttribute('r',r);
  bg.setAttribute('class','rest-ring-bg');
  var fg = document.createElementNS(svgNS,'circle');
  fg.setAttribute('cx',100); fg.setAttribute('cy',100); fg.setAttribute('r',r);
  fg.setAttribute('class','rest-ring-fg');
  fg.style.strokeDasharray = String(circumference);
  svg.appendChild(bg);
  svg.appendChild(fg);
  var secondsEl = document.createElement('div');
  secondsEl.className = 'rest-seconds';
  ringWrap.appendChild(svg);
  ringWrap.appendChild(secondsEl);
  wrap.appendChild(ringWrap);

  var nextLabel = document.createElement('div');
  nextLabel.className = 'rest-next';
  wrap.appendChild(nextLabel);

  app.appendChild(wrap);

  var btnRow = document.createElement('div');
  btnRow.className = 'session-btn-row';
  var addBtn = document.createElement('button');
  addBtn.className = 'btn';
  addBtn.textContent = 'הוסיפי 30 שניות';
  addBtn.addEventListener('click', function(){
    state.activeSession.restDurationSec += 30;
    state.activeSession.restEndAt = new Date(new Date(state.activeSession.restEndAt).getTime() + 30000).toISOString();
    saveState();
    updateRestDisplay();
  });
  var skipRestBtn = document.createElement('button');
  skipRestBtn.className = 'btn';
  skipRestBtn.textContent = 'דלגי על המנוחה';
  skipRestBtn.addEventListener('click', function(){
    clearRestTicker();
    finishRest();
  });
  btnRow.appendChild(addBtn);
  btnRow.appendChild(skipRestBtn);
  app.appendChild(btnRow);

  function updateRestDisplay(){
    var s2 = state.activeSession;
    if(!s2 || s2.phase !== 'resting'){ clearRestTicker(); return; }
    var left = Math.max(0, Math.round((new Date(s2.restEndAt).getTime() - Date.now())/1000));
    secondsEl.textContent = formatMMSS(left);
    var frac = s2.restDurationSec>0 ? Math.min(1, Math.max(0, left/s2.restDurationSec)) : 0;
    fg.style.strokeDashoffset = String(circumference*(1-frac));

    if(left <= 3 && left >= 1 && s2.lastAnnouncedSecond !== left){
      s2.lastAnnouncedSecond = left;
      var COUNT_WORDS = {3:'שלוש', 2:'שתיים', 1:'אחת'};
      if(state.profile.voiceEnabled && VOICE_STATE.available){
        speak(COUNT_WORDS[left]);
      }else{
        beep(left===1 ? 1200 : 880, 130);
      }
    }

    var curLogs = (s2.setLogs[s2.currentIndex]||[]).length;
    var cur = s2.exercises[s2.currentIndex];
    if(cur.kind==='main' && curLogs < cur.sets){
      nextLabel.textContent = 'סט הבא: ' + EXERCISE_BY_ID[cur.exerciseId].he;
    }else if(s2.exercises[s2.currentIndex+1]){
      nextLabel.textContent = 'הבא: ' + EXERCISE_BY_ID[s2.exercises[s2.currentIndex+1].exerciseId].he;
    }else{
      nextLabel.textContent = 'זהו, הגעת לסוף האימון';
    }

    if(left<=0){
      clearRestTicker();
      finishRest();
    }
  }

  updateRestDisplay();
  clearRestTicker();
  restIntervalHandle = setInterval(updateRestDisplay, 1000);
}

  var ex = EXERCISE_BY_ID[item.exerciseId];

  var h = document.createElement('h2');
  h.textContent = 'כואב לך ב' + ex.he + '?';
  app.appendChild(h);
  var p = document.createElement('p');
  p.textContent = 'אם זה כאב חד או כאב במפרק (לא סתם צריבה רגילה בשריר) - עדיף להוציא את התרגיל הזה מהתוכניות הבאות. תמיד אפשר להפעיל אותו מחדש בהגדרות.';
  app.appendChild(p);

  var spacer = document.createElement('div');
  spacer.className = 'spacer';
  app.appendChild(spacer);

  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn btn-danger';
  confirmBtn.textContent = 'כן, תוציאי את זה';
  confirmBtn.addEventListener('click', confirmPain);
  app.appendChild(confirmBtn);

  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost';
  cancelBtn.textContent = 'לא, בטעות לחצתי';
  cancelBtn.addEventListener('click', function(){ s.phase='exercise'; saveState(); render(); });
  app.appendChild(cancelBtn);
}

function renderSessionSummary(){
  var s = state.activeSession;
  var summary = s.summary || {totalMinutes:0, totalVolume:0, prNames:[]};

  var h = document.createElement('div');
  h.className = 'greet';
  h.textContent = 'כל הכבוד, ' + state.profile.name + '!';
  app.appendChild(h);

  var card = document.createElement('div');
  card.className = 'day-card';
  var row1 = document.createElement('div');
  row1.className = 'ex-row';
  row1.innerHTML = '<span>זמן אימון</span><span class="muted">'+summary.totalMinutes+' דקות</span>';
  var row2 = document.createElement('div');
  row2.className = 'ex-row';
  row2.innerHTML = '<span>נפח כולל</span><span class="muted"><bdi>'+summary.totalVolume+' ק"ג</bdi></span>';
  card.appendChild(row1);
  card.appendChild(row2);
  app.appendChild(card);

  if(summary.prNames.length){
    var prBox = document.createElement('div');
    prBox.className = 'pr-box';
    prBox.innerHTML = '<b>שיא אישי חדש! 🎉</b>' + esc(summary.prNames.join(', '));
    app.appendChild(prBox);
  }

  var closing = document.createElement('p');
  closing.textContent = 'עוד אימון מאחורייך. תמשיכי ככה.';
  app.appendChild(closing);

  var spacer = document.createElement('div');
  spacer.className = 'spacer';
  app.appendChild(spacer);

  var shareBtn = document.createElement('button');
  shareBtn.className = 'btn';
  shareBtn.textContent = 'שתפי אימון 📤';
  shareBtn.addEventListener('click', shareSession);
  app.appendChild(shareBtn);

  var doneBtn = document.createElement('button');
  doneBtn.className = 'btn btn-primary';
  doneBtn.textContent = 'סיום, חזרה הביתה';
  doneBtn.addEventListener('click', endSession);
  app.appendChild(doneBtn);
}

function buildShareText(){
  var s = state.activeSession;
  var day = state.plan.days.filter(function(d){ return d.id === s.dayId; })[0];
  var dateStr = new Date(s.startedAt).toLocaleDateString('he-IL');
  var summary = s.summary || {totalMinutes:0, totalVolume:0, prNames:[]};

  var lines = [];
  lines.push('אימון ' + (day ? day.nameHe : '') + ' - ' + dateStr);
  lines.push('');
  s.exercises.forEach(function(item, idx){
    if(item.kind !== 'main') return;
    var setsLogged = s.setLogs[idx];
    if(!setsLogged || !setsLogged.length) return;
    var ex = EXERCISE_BY_ID[item.exerciseId];
    var best = sessionMaxWeight({sets:setsLogged});
    lines.push('• ' + ex.he + ' - ' + setsLogged.length + ' סטים, עד ' + best + ' ק"ג');
  });
  lines.push('');
  lines.push('זמן אימון: ' + summary.totalMinutes + ' דקות');
  lines.push('נפח כולל: ' + summary.totalVolume + ' ק"ג');
  if(summary.prNames.length){
    lines.push('שיא אישי חדש: ' + summary.prNames.join(', ') + ' 🎉');
  }
  lines.push('');
  lines.push('💪 אימון הושלם');
  return lines.join('\n');
}

function shareSession(){
  var text = buildShareText();
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  }else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('הועתק ללוח - אפשר להדביק בוואטסאפ');
    }).catch(function(){
      toast('לא הצלחתי להעתיק');
    });
  }else{
    toast('שיתוף לא נתמך בדפדפן הזה');
  }
}

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
initVoice();
render();
</script>
